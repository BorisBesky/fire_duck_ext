extension:
  name: fire_duck_ext
  description: Query Google Cloud Firestore directly from DuckDB using SQL
  version: 0.2.1
  language: C++
  build: cmake
  license: MIT
  excluded_platforms: "windows_amd64_mingw"
  maintainers:
    - BorisBesky

repo:
  github: BorisBesky/fire_duck_ext
  ref: 5deb4717435245d9433a14dd08d49a8000531409

docs:
  hello_world: |
    LOAD fire_duck_ext;

    -- Authenticate with a service account key file (see the README for API-key
    -- and Firebase-user auth, including browser-safe authentication)
    CREATE SECRET my_firestore (
        TYPE firestore,
        PROJECT_ID 'my-gcp-project',
        SERVICE_ACCOUNT_JSON '/path/to/service-account.json'
    );

    -- Read documents
    SELECT * FROM firestore_scan('users');

    -- Read a collection of large documents in smaller pages
    SELECT * FROM firestore_scan('scanned_documents', page_size:=50);

    -- Filter with SQL
    SELECT __document_id, name, email
    FROM firestore_scan('users')
    WHERE status = 'active';

    -- Update a document
    CALL firestore_update('users', 'user123', 'status', 'verified');

    -- Insert documents from a subquery
    CALL firestore_insert('users', (SELECT name, age FROM read_csv('new_users.csv')));

  extended_description: |
    fire_duck_ext lets you work with Google Cloud Firestore directly from DuckDB
    using SQL. Scan collections with firestore_scan(), including collection-group
    queries (firestore_scan('~collection')) and subcollection-ID discovery
    (firestore_scan('collection/doc_id')). Write with firestore_insert(),
    firestore_update(), firestore_delete(), their batch counterparts
    (firestore_update_batch(), firestore_delete_batch()), and the array-transform
    functions firestore_array_union(), firestore_array_remove(), and
    firestore_array_append(). WHERE filters, SQL ORDER BY / LIMIT, and the
    column projection are pushed down to Firestore where possible, so
    unselected fields and non-matching rows never cross the wire. A bare
    COUNT(*) is answered by Firestore's aggregation API without transferring
    any documents (on an ordinary collection this needs show_missing:=false,
    since a scan counts phantom documents and an aggregation query does not).

    Scans stream: one page of documents is held at a time and the next is
    fetched only as DuckDB consumes the current one, so a collection of any
    size can be read without holding it in memory. Collection groups paginate
    by cursor rather than stopping at the first page. An unfiltered, unordered
    scan of an ordinary collection with show_missing:=false can be split into
    document-key ranges and read by several threads at once
    (firestore_max_threads, off by default -- it pays off for Firestore auto-ids
    and costs time for ids that cluster into one range). page_size (or the
    firestore_page_size setting) controls how many documents each round trip
    fetches, and firestore_page_byte_budget shrinks that automatically when a
    page turns out to weigh more than the budget allows -- which matters for
    collections whose documents approach Firestore's 1 MiB limit.

    Firestore's schemaless documents are mapped to typed DuckDB columns
    automatically, with configurable handling for nested maps (map_encoding)
    and fields that only appear in some documents (schema_sample_size,
    unmapped_column, columns). Schema inference streams too, so sampling every
    document of a large collection costs one page of memory rather than the
    whole collection.

    Secrets require PROJECT_ID and one of: a service-account key **file path**
    (SERVICE_ACCOUNT_JSON, admin access, bypasses Security Rules via IAM,
    native-only) -- never embed this key in application code or a browser
    context; an API_KEY (unauthenticated, request.auth is null); or Firebase
    Auth user credentials (EMAIL/PASSWORD, ANONYMOUS, or a pre-obtained
    ID_TOKEN) -- authenticated, respects Security Rules, and works in the
    WebAssembly/browser build. GOOGLE_APPLICATION_CREDENTIALS is also read on
    startup if set.

    The extension also builds and runs under DuckDB-WASM using API-key or
    Firebase-user auth (service-account auth needs OpenSSL and is native-only).

    See the project README for the full parameter reference, type mapping,
    pushdown semantics, and platform notes.
