#
# This workflow calls the main distribution pipeline from DuckDB to build, test and (optionally) release the extension
#
name: Main Extension Distribution Pipeline
on:
  push:
    # Doc-only pushes skip the build+test matrix. Deliberately NOT applied to
    # pull_request: the required-status-check contexts on main (e.g. "Build
    # extension binaries / MacOS") are jobs *inside* the reusable workflows
    # this file calls. If the calling job here never runs, those contexts
    # never get a status posted at all -- not "skipped", just permanently
    # missing -- and with required_status_checks.strict=true a doc-only PR
    # would sit stuck forever. Direct pushes to main aren't affected by branch
    # protection here (enforce_admins=false), so this is safe for that path only.
    paths-ignore:
      - 'README.md'
      - 'description.yml'
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.head_ref || '' }}-${{ github.base_ref || '' }}-${{ github.ref != 'refs/heads/main' && github.sha || '' }}
  cancel-in-progress: true

jobs:
  duckdb-stable-build:
    name: Build extension binaries
    uses: duckdb/extension-ci-tools/.github/workflows/_extension_distribution.yml@v1.5.4
    with:
      duckdb_version: v1.5.4
      ci_tools_version: v1.5.4
      extension_name: fire_duck_ext
      exclude_archs: 'windows_amd64_mingw'

  code-quality-check:
    name: Code Quality Check
    uses: duckdb/extension-ci-tools/.github/workflows/_extension_code_quality.yml@v1.5.4
    with:
      duckdb_version: v1.5.4
      ci_tools_version: v1.5.4
      extension_name: fire_duck_ext
      format_checks: 'format;tidy'
